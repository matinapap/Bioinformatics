[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bioseq"
version = "1.0.0"
description = "Reproducible DNA sequence alignment and profile-HMM teaching pipeline"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Matina Papadakou" },
    { name = "George Christopoulos" },
]
keywords = ["bioinformatics", "sequence-alignment", "needleman-wunsch", "upgma", "profile-hmm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.scripts]
bioseq = "bioseq.__main__:main"

[project.urls]
Repository = "https://github.com/matinapap/Bioinformatics"

[tool.setuptools]
packages = ["bioseq"]
